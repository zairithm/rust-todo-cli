[package]
name = "rust-todo-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line task manager with JSON storage"
license = "MIT"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
